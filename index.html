<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Sirkel Bulan Purnama</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Hanken+Grotesk:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="bg" aria-hidden="true"><svg class="ring" id="ring" viewBox="-200 -200 400 400"></svg></div>

  <header class="top">
    <div class="brand"><span class="tag">SIRKEL</span><span class="name" id="circleName"></span></div>
    <div class="today" aria-label="Tanggal hari ini">
      <div class="dnum" id="dNum"></div>
      <div class="dmeta"><b id="dDay"></b><span id="dMon"></span></div>
      <div id="todayMoon"></div>
      <button class="sfx" id="sfx" type="button" aria-pressed="true">SFX</button>
      <button class="sfx" id="bgmBtn" type="button" aria-pressed="true">Musik</button>
    </div>
  </header>

  <main class="stage">
    <nav class="menu" id="menu" aria-label="Menu utama"></nav>
    <section class="panel" id="panel" aria-live="polite">
      <div class="wipe" id="wipe"></div>
      <div class="inner" id="inner" tabindex="-1"></div>
    </section>
  </main>

  <footer class="hint">
    <span class="kb"><kbd>↑</kbd><kbd>↓</kbd>pilih menu</span>
    <span class="kb"><kbd>Enter</kbd>masuk ke isi</span>
    <span class="kb"><kbd>Esc</kbd>kembali ke beranda</span>
    <span>Acumalaka</span>
  </footer>
  <div class="toast" id="toast" role="status"></div>
  <div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Foto galeri" hidden>
    <div class="lbwrap">
      <div class="lbimg" id="lbimg"></div>
      <div class="lbbar">
        <p class="lbcap" id="lbcap"></p>
        <button class="nb" type="button" data-lb="prev" aria-label="Foto sebelumnya">◀</button>
        <button class="nb" type="button" data-lb="next" aria-label="Foto berikutnya">▶</button>
        <button class="cp" id="lbclose" type="button" data-lb="close">Tutup</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
